<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listening History</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/echarts/echarts.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16v-4M8 18V8M12 20V4M16 17V9M20 14v-2" /></svg>
        <div>
          <div class="brand-title">Listening history</div>
          <div class="brand-sub" id="range-label">Loading…</div>
        </div>
      </div>
      <nav class="tabs" aria-label="Dashboards">
        <a href="#/overview" data-view="overview">Overview</a>
        <a href="#/top/artist" data-view="top">Top charts</a>
        <a href="#/repeat" data-view="repeat">On repeat</a>
        <a href="#/habits" data-view="habits">Habits</a>
        <a href="#/discovery" data-view="discovery">Discovery</a>
        <a href="#/devices" data-view="devices">Devices</a>
        <a href="#/explore" data-view="explore">Explore</a>
      </nav>
      <button class="icon-btn" id="theme-toggle" type="button" title="Theme: system" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></svg>
      </button>
    </div>
  </header>

  <form class="filters" id="filters" onsubmit="return false">
    <label class="field">
      <span>Period</span>
      <select id="f-period"></select>
    </label>
    <span class="field custom-range" id="custom-range" hidden>
      <input type="date" id="f-from" aria-label="From">
      <span class="muted">to</span>
      <input type="date" id="f-to" aria-label="To">
    </span>
    <label class="field">
      <span>Content</span>
      <select id="f-kind">
        <option value="music">Music</option>
        <option value="podcasts">Podcasts</option>
        <option value="all">Everything</option>
      </select>
    </label>
    <label class="field">
      <span title="Plays shorter than this still add to listening time, but don't count as a play">Count a play after</span>
      <select id="f-min">
        <option value="0">Any length</option>
        <option value="30000" selected>30 seconds</option>
        <option value="60000">1 minute</option>
      </select>
    </label>
  </form>

  <main id="view" class="view" aria-live="polite">
    <div class="state-msg">Loading your listening history…</div>
  </main>

  <footer class="footer">
    Runs entirely on your computer from your Spotify data export. Times are shown in your browser's time zone.
  </footer>
</body>
</html>
